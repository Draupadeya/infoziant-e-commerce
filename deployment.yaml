apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultex-storefront
  labels:
    app: vaultex-storefront
    tier: frontend
spec:
  replicas: 2 # Demonstrates Kubernetes Pod replication & high availability
  selector:
    matchLabels:
      app: vaultex-storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vaultex-storefront
        tier: frontend
    spec:
      containers:
      - name: vaultex-app
        # Docker Hub image for phanindrakilambi (v1.1 with updated watch & clean headers)
        image: phanindrakilambi/vaultex-storefront:v1.1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

